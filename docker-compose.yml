services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tdiu_davomat_bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
      GOOGLE_CREDENTIALS: /run/secrets/google-service-account.json
    volumes:
      - type: bind
        source: ${GOOGLE_CREDENTIALS:-./credentials.json}
        target: /run/secrets/google-service-account.json
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
